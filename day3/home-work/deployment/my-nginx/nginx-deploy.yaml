apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-deploy
  name: nginx-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-deploy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 15%           # Pod เพิ่มได้สูงสุด 15% ระหว่าง update
      maxUnavailable: 24%     # Pod ดับได้สูงสุด 24% ระหว่าง update
  template:
    metadata:
      labels:
        app: nginx-deploy
    spec:
      containers:
      - image: nginx:1.25-alpine
        name: nginx
        resources: {}
status: {}
